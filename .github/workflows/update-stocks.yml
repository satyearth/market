name: Update Stock Universe

on:
  schedule:
    # Run every weekday Monday to Friday at 18:30 IST (13:00 UTC) after market close
    - cron: '0 13 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions

permissions:
  contents: write

jobs:
  sync-stocks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start NSE-BSE MCP Server
        run: |
          npx -y nse-bse-mcp &
          sleep 8

      - name: Synchronize Stock Universe
        run: |
          node scripts/sync-stock-universe.js

      - name: Verify Dataset Integrity
        run: |
          node scripts/verify-dataset.js

      - name: Commit and push if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add js/stocks-data.js index.html downloads/
          if git diff --staged --quiet; then
            echo "No changes in stock universe."
          else
            git commit -m "chore(data): auto-update NSE & BSE stock universe [skip ci]"
            git push
          fi
